<h1> My To-do List</h1>

<form (ngSubmit)="add()">
  <input
    [(ngModel)]="newTodo"
    name="newTodo"
  placeholder="Add what you want to do..."
    autocomplete="off"
  />  <!--bat buoc khi dung ngModel-->
  <button type="submit">Add</button>
</form>


<!--danh sach todo-->
<ul>
  @for (t of todos; track t) {
    <li>{{ t }}</li>
  }
</ul>
